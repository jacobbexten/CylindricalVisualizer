<!doctype html>
<html lang="en" data-theme="ice">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070b1a" />
    <meta
      name="description"
      content="Interactive 3D visualizer for tapered cylindrical segments."
    />
    <title>Cylindrical Visualizer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070b1a'/%3E%3Cpath d='M8 9 L25 12 L25 20 L8 23 Z' fill='%2369b4cc' fill-opacity='.5' stroke='%239fe3f5' stroke-width='1.5' stroke-linejoin='round'/%3E%3Cellipse cx='8' cy='16' rx='2.5' ry='7' fill='%2369b4cc'/%3E%3C/svg%3E"
    />
    <script>
      // apply the saved theme before first paint to avoid a flash of the default
      try {
        const saved = localStorage.getItem("theme");
        if (saved) document.documentElement.dataset.theme = saved;
      } catch {
        // storage unavailable (private mode etc.): keep the default
      }
    </script>
    <link rel="stylesheet" href="app.css" />
  </head>

  <body>
    <!-- the three.js canvas is inserted here by main.js, behind the UI -->
    <div class="grid-overlay" aria-hidden="true"></div>

    <div class="app">
      <header class="glass header">
        <h1 class="title">Cylindrical Visualizer</h1>
        <div class="theme-picker" role="group" aria-label="Theme">
          <button
            type="button"
            class="theme-swatch"
            data-theme-option="ice"
            aria-label="Ice theme"
            aria-pressed="true"
          ></button>
          <button
            type="button"
            class="theme-swatch"
            data-theme-option="nebula"
            aria-label="Nebula theme"
            aria-pressed="false"
          ></button>
          <button
            type="button"
            class="theme-swatch"
            data-theme-option="solar"
            aria-label="Solar theme"
            aria-pressed="false"
          ></button>
        </div>
      </header>

      <!-- empty area the cylinder is centered in; the canvas behind shows through -->
      <main class="stage" aria-label="3D view"></main>

      <!-- volume readout, printed by volumeConsole.js: docked across the
           bottom on desktop, a pop-up on phones -->
      <section
        id="volumeConsole"
        class="glass console"
        aria-labelledby="console-title"
      >
        <div class="console-bar">
          <span class="console-lights" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <h2 id="console-title" class="console-title">
            volumetrics://segment
          </h2>
          <!-- desktop only: replaces the panel's Calculate volume button there -->
          <button
            type="button"
            id="consoleRun"
            class="console-run"
            aria-label="Calculate volume"
          >
            <span aria-hidden="true">▶</span> run
          </button>
          <button
            type="button"
            id="consoleClose"
            class="console-close"
            aria-label="Close volume console"
          >
            ×
          </button>
        </div>
        <div class="console-screen">
          <!-- the typed output is visual only; consoleStatus announces the result -->
          <div
            id="consoleOutput"
            class="console-output"
            aria-hidden="true"
          ></div>
          <div class="console-static" aria-hidden="true"></div>
        </div>
        <p id="consoleStatus" class="visually-hidden" role="status"></p>
      </section>
      <div id="consoleBackdrop" class="console-backdrop"></div>

      <aside class="glass panel">
        <section class="panel-section" aria-labelledby="dimensions-heading">
          <div class="section-header">
            <h2 id="dimensions-heading" class="section-heading">Dimensions</h2>
            <span id="frustumLight" class="frustum-light" aria-hidden="true">
              <span class="frustum-dot"></span>Frustum detected
            </span>
          </div>
          <p id="frustumStatus" class="visually-hidden" role="status"></p>
          <div class="control">
            <div class="control-header">
              <label class="control-label" for="bottomDiameterSlider"
                >Bottom diameter</label
              >
              <output class="control-value" for="bottomDiameterSlider"
                ><span id="bottomValue"></span> in</output
              >
            </div>
            <input
              id="bottomDiameterSlider"
              type="range"
              min="12"
              max="24"
              value="19"
              step="1"
              class="slider"
            />
          </div>
          <div class="control">
            <div class="control-header">
              <label class="control-label" for="topDiameterSlider"
                >Top diameter</label
              >
              <output class="control-value" for="topDiameterSlider"
                ><span id="topValue"></span> in</output
              >
            </div>
            <input
              id="topDiameterSlider"
              type="range"
              min="12"
              max="24"
              value="17"
              step="1"
              class="slider"
            />
          </div>
          <div class="control">
            <div class="control-header">
              <label class="control-label" for="lengthSlider">Length</label>
              <output class="control-value" for="lengthSlider"
                ><span id="lengthValue"></span> ft</output
              >
            </div>
            <input
              id="lengthSlider"
              type="range"
              min="8"
              max="20"
              value="8"
              step="1"
              class="slider"
            />
          </div>
        </section>

        <section class="panel-section" aria-labelledby="ends-heading">
          <h2 id="ends-heading" class="section-heading">End profiles</h2>
          <button
            type="button"
            id="detectFlawsButton"
            class="action-button"
            aria-pressed="false"
          >
            <span class="action-indicator" aria-hidden="true"></span>
            Detect flaws
          </button>
          <div class="end-vis-row">
            <figure class="end-vis">
              <figcaption class="end-vis-label">Bottom</figcaption>
              <!-- rings, spokes and profile are drawn by main.js -->
              <svg
                id="bottomRadar"
                class="radar-chart"
                aria-hidden="true"
              ></svg>
            </figure>
            <figure class="end-vis">
              <figcaption class="end-vis-label">Top</figcaption>
              <!-- rings, spokes and profile are drawn by main.js -->
              <svg id="topRadar" class="radar-chart" aria-hidden="true"></svg>
            </figure>
          </div>
        </section>

        <!-- phones only: on desktop the docked console's run button replaces it -->
        <section
          class="panel-section volume-section"
          aria-labelledby="volume-heading"
        >
          <h2 id="volume-heading" class="section-heading">Volume</h2>
          <button
            type="button"
            id="calculateVolumeButton"
            class="action-button accent"
            aria-controls="volumeConsole"
          >
            <span class="action-indicator" aria-hidden="true"></span>
            Calculate volume
          </button>
        </section>
      </aside>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
